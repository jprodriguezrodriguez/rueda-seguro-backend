<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Proyecto Motos</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <!-- Loading overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-content">
            <img src="img/loading.gif" alt="Cargando..." class="loading-gif">
            <p id="loadingText" class="loading-text">Creando cuenta...</p>
        </div>
    </div>

    <div class="container">
        <div class="login-form">
            <div class="form-header">
                <h1>  Proyecto Motos</h1>
                <h2>Crear Cuenta</h2>
            </div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Nombre de usuario:</label>
                    <input type="text" id="username" name="username" required minlength="3">
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required minlength="6">
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirmar contraseña:</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
                </div>
                
                <button type="submit" class="btn-primary">Registrarse</button>
                
                <div class="form-footer">
                    <p>¿Ya tienes cuenta? <a href="/">Inicia sesión aquí</a></p>
                </div>
            </form>
            
            <div id="message" class="message"></div>
        </div>
    </div>

    <script src="js/register.js"></script>
</body>
</html>
